name: Actualizar EPG Ecuador

on:
  workflow_dispatch:

  # GitHub Actions interpreta cron en UTC.
  # 09:17 UTC = 04:17 en Ecuador continental.
  # 21:17 UTC = 16:17 en Ecuador continental.
  schedule:
    - cron: "17 9,21 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-epg
  cancel-in-progress: false

jobs:
  build:
    name: Generar guía EPG
    runs-on: ubuntu-latest

    steps:
      - name: Descargar este repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Descargar iptv-org/epg
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch master \
            https://github.com/iptv-org/epg.git \
            upstream

      - name: Instalar dependencias
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Generar guía EPG de Ecuador
        working-directory: upstream
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          TZ: "America/Guayaquil"
        run: |
          set -euo pipefail

          mkdir -p ../public

          # Utilizar la fecha vigente en Ecuador continental,
          # aunque UTC ya se encuentre en el día siguiente.
          CURR_DATE="$(date +'%Y-%m-%d')"
          export CURR_DATE

          echo "EPG_DATE_ISO=${CURR_DATE}" >> "${GITHUB_ENV}"

          echo "Zona horaria: ${TZ}"
          echo "Fecha y hora de Ecuador: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Fecha base para obtener la programación: ${CURR_DATE}"

          npm run grab --- \
            --channels=sites/epgshare01.online/epgshare01.online_EC1.channels.xml \
            --output=../public/ec.xml \
            --gzip=../public/ec.xml.gz \
            --days=2 \
            --maxConnections=1

      - name: Establecer cabecera XMLTV exacta
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          from pathlib import Path

          xml_path = Path("public/ec.xml")

          if not xml_path.exists():
              raise FileNotFoundError("No se encontró public/ec.xml.")

          xml = xml_path.read_text(
              encoding="utf-8-sig",
              errors="strict",
          )

          # Eliminar la declaración XML generada originalmente.
          xml = re.sub(
              r"^\s*<\?xml[^>]*\?>\s*",
              "",
              xml,
              count=1,
              flags=re.IGNORECASE,
          )

          # Eliminar cualquier DOCTYPE previo.
          xml = re.sub(
              r"""^\s*<!DOCTYPE\s+tv(?:\s+SYSTEM\s+(?:"[^"]*"|'[^']*'))?\s*>\s*""",
              "",
              xml,
              count=1,
              flags=re.IGNORECASE,
          )

          xml = xml.lstrip()

          # Sustituir completamente la etiqueta inicial <tv>,
          # eliminando date y cualquier otro atributo anterior.
          xml, replacements = re.subn(
              r"^<tv\b[^>]*>",
              '<tv generator-info-name="none" generator-info-url="none">',
              xml,
              count=1,
              flags=re.IGNORECASE,
          )

          if replacements != 1:
              raise RuntimeError(
                  "No se pudo localizar o reemplazar la etiqueta inicial <tv>."
              )

          # Cabecera solicitada:
          # línea 1: declaración XML
          # línea 2: DOCTYPE
          # línea 3: vacía
          # línea 4: etiqueta <tv> exacta
          header = (
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<!DOCTYPE tv SYSTEM "xmltv.dtd">\n'
              '\n'
          )

          final_xml = header + xml

          xml_path.write_text(
              final_xml,
              encoding="utf-8",
              newline="\n",
          )

          print("Cabecera XMLTV establecida correctamente.")
          PY

          echo "Primeras cuatro líneas:"
          sed -n '1,4p' public/ec.xml

      - name: Descargar DTD oficial de XMLTV
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 2 \
            https://raw.githubusercontent.com/XMLTV/xmltv/master/xmltv.dtd \
            --output public/xmltv.dtd

          test -s public/xmltv.dtd

          echo "xmltv.dtd descargado correctamente."
          echo "Tamaño: $(du -h public/xmltv.dtd | cut -f1)"

      - name: Volver a comprimir el XML corregido
        shell: bash
        run: |
          set -euo pipefail

          # El archivo GZIP generado inicialmente todavía contiene
          # la cabecera antigua. Se reemplaza por la versión corregida.
          gzip -9 -n -c public/ec.xml > public/ec.xml.gz.tmp
          mv public/ec.xml.gz.tmp public/ec.xml.gz

          gzip -t public/ec.xml.gz

          # Verificar que el contenido descomprimido sea idéntico
          # al archivo ec.xml publicado.
          cmp public/ec.xml <(gzip -dc public/ec.xml.gz)

          echo "ec.xml.gz creado y comprobado correctamente."

      - name: Validar cabecera XMLTV exacta
        shell: bash
        run: |
          set -euo pipefail

          test -s public/ec.xml
          test -s public/ec.xml.gz
          test -s public/xmltv.dtd

          FIRST_LINE="$(sed -n '1p' public/ec.xml)"
          SECOND_LINE="$(sed -n '2p' public/ec.xml)"
          THIRD_LINE="$(sed -n '3p' public/ec.xml)"
          FOURTH_LINE="$(sed -n '4p' public/ec.xml)"

          EXPECTED_FIRST='<?xml version="1.0" encoding="UTF-8"?>'
          EXPECTED_SECOND='<!DOCTYPE tv SYSTEM "xmltv.dtd">'
          EXPECTED_FOURTH='<tv generator-info-name="none" generator-info-url="none">'

          if [ "${FIRST_LINE}" != "${EXPECTED_FIRST}" ]; then
            echo "::error::La primera línea de ec.xml no es correcta."
            printf 'Esperada: %s\n' "${EXPECTED_FIRST}"
            printf 'Obtenida: %s\n' "${FIRST_LINE}"
            exit 1
          fi

          if [ "${SECOND_LINE}" != "${EXPECTED_SECOND}" ]; then
            echo "::error::La segunda línea de ec.xml no es correcta."
            printf 'Esperada: %s\n' "${EXPECTED_SECOND}"
            printf 'Obtenida: %s\n' "${SECOND_LINE}"
            exit 1
          fi

          if [ -n "${THIRD_LINE}" ]; then
            echo "::error::La tercera línea debe estar vacía."
            printf 'Obtenida: %s\n' "${THIRD_LINE}"
            exit 1
          fi

          if [ "${FOURTH_LINE}" != "${EXPECTED_FOURTH}" ]; then
            echo "::error::La etiqueta inicial <tv> no es exacta."
            printf 'Esperada: %s\n' "${EXPECTED_FOURTH}"
            printf 'Obtenida: %s\n' "${FOURTH_LINE}"
            exit 1
          fi

          echo "Cabecera exacta confirmada:"
          sed -n '1,4p' public/ec.xml

      - name: Validar estructura y contenido XMLTV
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          xml_path = Path("public/ec.xml")

          tree = ET.parse(xml_path)
          root = tree.getroot()

          expected_attributes = {
              "generator-info-name": "none",
              "generator-info-url": "none",
          }

          if root.tag != "tv":
              raise RuntimeError(
                  f"La etiqueta raíz debería ser tv, pero es {root.tag!r}."
              )

          if root.attrib != expected_attributes:
              raise RuntimeError(
                  "Los atributos de <tv> no son exactamente los esperados. "
                  f"Encontrados: {root.attrib!r}"
              )

          channels = root.findall("channel")
          programmes = root.findall("programme")

          if not channels:
              raise RuntimeError(
                  "La guía XMLTV no contiene canales."
              )

          if not programmes:
              raise RuntimeError(
                  "La guía XMLTV no contiene programas."
              )

          channel_ids = {
              channel.get("id")
              for channel in channels
              if channel.get("id")
          }

          programmes_without_channel = [
              programme
              for programme in programmes
              if not programme.get("channel")
          ]

          unknown_channels = {
              programme.get("channel")
              for programme in programmes
              if programme.get("channel") not in channel_ids
          }

          if programmes_without_channel:
              raise RuntimeError(
                  "Existen programas sin atributo channel."
              )

          if unknown_channels:
              sample = sorted(unknown_channels)[:10]
              raise RuntimeError(
                  "Existen programas asociados a canales inexistentes: "
                  + ", ".join(sample)
              )

          print(f"Canales encontrados: {len(channels)}")
          print(f"Programas encontrados: {len(programmes)}")
          print("La estructura XMLTV es válida.")
          PY

          echo "Tamaño de ec.xml:"
          du -h public/ec.xml

          echo "Tamaño de ec.xml.gz:"
          du -h public/ec.xml.gz

          echo "Tamaño de xmltv.dtd:"
          du -h public/xmltv.dtd

      - name: Crear página informativa
        shell: bash
        env:
          TZ: "America/Guayaquil"
        run: |
          set -euo pipefail

          touch public/.nojekyll

          UPDATED="$(date '+%Y-%m-%d %H:%M:%S')"

          cat > public/index.html <<HTML
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta
              name="viewport"
              content="width=device-width, initial-scale=1"
            >
            <title>EPG Ecuador</title>

            <style>
              body {
                max-width: 760px;
                margin: 50px auto;
                padding: 0 20px;
                font-family: system-ui, sans-serif;
                line-height: 1.6;
              }

              a {
                display: block;
                margin: 14px 0;
                font-size: 1.1rem;
              }

              code {
                overflow-wrap: anywhere;
              }
            </style>
          </head>

          <body>
            <h1>EPG Ecuador</h1>

            <p>
              Guía electrónica de programación en formato XMLTV,
              generada automáticamente mediante GitHub Actions.
            </p>

            <h2>Archivos disponibles</h2>

            <a href="./ec.xml">
              Descargar ec.xml
            </a>

            <a href="./ec.xml.gz">
              Descargar ec.xml.gz
            </a>

            <a href="./xmltv.dtd">
              Descargar xmltv.dtd
            </a>

            <h2>URL recomendada para reproductores</h2>

            <p>
              <code>https://mrgmaw.github.io/epg/ec.xml.gz</code>
            </p>

            <h2>URL XML sin comprimir</h2>

            <p>
              <code>https://mrgmaw.github.io/epg/ec.xml</code>
            </p>

            <p>
              Fecha base de la programación:
              <strong>${EPG_DATE_ISO}</strong>
            </p>

            <p>
              Última generación:
              <strong>${UPDATED}</strong>,
              hora de Ecuador.
            </p>
          </body>
          </html>
          HTML

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos para GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar guía
        id: deployment
        uses: actions/deploy-pages@v4
