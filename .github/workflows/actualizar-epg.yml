name: Actualizar EPG Ecuador

on:
  # Permite ejecutar el proceso manualmente desde Actions.
  workflow_dispatch:

  # Actualización automática dos veces al día:
  # 04:17 y 16:17, hora de Ecuador continental.
  schedule:
    - cron: "17 4,16 * * *"
      timezone: "America/Guayaquil"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages-epg"
  cancel-in-progress: false

jobs:
  build:
    name: Generar guía EPG
    runs-on: ubuntu-latest

    steps:
      - name: Descargar este repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Descargar iptv-org/epg
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch master \
            https://github.com/iptv-org/epg.git \
            upstream

      - name: Instalar dependencias
        working-directory: upstream
        run: |
          set -euo pipefail
          npm ci

      - name: Generar guía EPG de Ecuador
        working-directory: upstream
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          TZ: "America/Guayaquil"
        run: |
          set -euo pipefail

          mkdir -p ../public

          # Fecha actual de Ecuador, aunque en UTC ya sea el día siguiente.
          export CURR_DATE="$(TZ=America/Guayaquil date +'%Y-%m-%d')"

          echo "Zona horaria: ${TZ}"
          echo "Fecha y hora de Ecuador:"
          TZ=America/Guayaquil date '+%Y-%m-%d %H:%M:%S %Z'

          echo "Fecha base utilizada por el EPG: ${CURR_DATE}"

          npm run grab --- \
            --channels=sites/epgshare01.online/epgshare01.online_EC1.channels.xml \
            --output=../public/ec.xml \
            --gzip=../public/ec.xml.gz \
            --days=2 \
            --maxConnections=1

      - name: Comprobar archivos y fecha generada
        env:
          TZ: "America/Guayaquil"
        run: |
          set -euo pipefail

          # Comprobar que los archivos existen y no están vacíos.
          test -s public/ec.xml
          test -s public/ec.xml.gz

          # Comprobar que el archivo GZIP no está dañado.
          gzip -t public/ec.xml.gz

          # Comprobar que existe la etiqueta principal XMLTV.
          grep -q '<tv date="' public/ec.xml

          # Fecha que debería aparecer en el encabezado.
          EXPECTED_DATE="$(TZ=America/Guayaquil date +'%Y%m%d')"

          # Extraer la fecha del encabezado:
          # <tv date="20260804">
          ACTUAL_DATE="$(
            sed -n 's/.*<tv date="[0-9]\{8\}".*/\1/p' \
              public/ec.xml |
              head -n 1
          )"

          echo "Fecha esperada: ${EXPECTED_DATE}"
          echo "Fecha encontrada: ${ACTUAL_DATE}"

          if [ -z "${ACTUAL_DATE}" ]; then
            echo "::error::No se pudo encontrar el atributo date en ec.xml."
            exit 1
          fi

          if [ "${ACTUAL_DATE}" != "${EXPECTED_DATE}" ]; then
            echo "::error::La fecha del EPG no coincide con la fecha de Ecuador."
            exit 1
          fi

          echo "La fecha del EPG es correcta."

          echo "Tamaño XML:"
          du -h public/ec.xml

          echo "Tamaño XML comprimido:"
          du -h public/ec.xml.gz

          echo "Canales encontrados:"
          grep -o '<channel ' public/ec.xml | wc -l || true

          echo "Programas encontrados:"
          grep -o '<programme ' public/ec.xml | wc -l || true

      - name: Crear página informativa
        env:
          TZ: "America/Guayaquil"
        run: |
          set -euo pipefail

          touch public/.nojekyll

          UPDATED="$(TZ=America/Guayaquil date '+%Y-%m-%d %H:%M:%S')"
          EPG_DATE="$(TZ=America/Guayaquil date '+%Y-%m-%d')"

          cat > public/index.html <<HTML
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>EPG Ecuador</title>

            <style>
              body {
                max-width: 760px;
                margin: 50px auto;
                padding: 0 20px;
                font-family: system-ui, sans-serif;
                line-height: 1.6;
              }

              a {
                display: block;
                margin: 14px 0;
                font-size: 1.1rem;
              }

              code {
                overflow-wrap: anywhere;
              }
            </style>
          </head>

          <body>
            <h1>EPG Ecuador</h1>

            <p>
              Guía electrónica de programación en formato XMLTV,
              generada automáticamente mediante GitHub Actions.
            </
